version: '3.8'

services:
  # ====== ZOOKEEPER ======
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # ====== KAFKA ======
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: Kafka-FyneOn
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

  postgres:
    image: postgres:15
    container_name: fyneon_postgres
    restart: always
    environment:
      POSTGRES_DB: fyneon
      POSTGRES_USER: fyneon_user
      POSTGRES_PASSWORD: fyneon_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    container_name: fyneon_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  #app:
    #build: .
    #container_name: fyneon_app
      #ports:
      #- "8080:8080"
      #depends_on:
      #- postgres
      #- mailhog
    #environment:
        #SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fyneon
        #SPRING_DATASOURCE_USERNAME: fyneon_user
        #SPRING_DATASOURCE_PASSWORD: fyneon_pass
        #SPRING_MAIL_HOST: mailhog
        #SPRING_MAIL_PORT: 1025
        #SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: false
        #SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: false

    # ====== REDIS ======
  redis:
    image: redis:7-alpine
    container_name: fyneon_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data: