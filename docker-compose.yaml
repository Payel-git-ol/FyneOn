version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fyneon_postgres
    restart: always
    environment:
      POSTGRES_DB: fyneon
      POSTGRES_USER: fyneon_user
      POSTGRES_PASSWORD: fyneon_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    container_name: fyneon_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # app:
  #   build: .
  #   container_name: fyneon_app
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - postgres
  #     - mailhog
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fyneon
  #     SPRING_DATASOURCE_USERNAME: fyneon_user
  #     SPRING_DATASOURCE_PASSWORD: fyneon_pass
  #     SPRING_MAIL_HOST: mailhog
  #     SPRING_MAIL_PORT: 1025
  #     SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: false
  #     SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: false

volumes:
  postgres_data:
